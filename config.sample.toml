[accounts.example]
default = true				# make this account the default one used
auto-refresh = true			# let token show refresh an expired token
#auto-refresh = false			# let token show print it expired
#resources = []				# RFC 8707 resource indicators
#extras.login_hint = "user@example.com"	# an extra authorization request parameter
#alpn = ["http/1.1"]			# for a middlebox refusing a handshake without ALPN

grant = "authorization-code"		# sign in through a browser redirection
#grant = "device"			# sign in elsewhere with a user code
#grant = "client-credentials"		# headless, authenticated by the secret
#grant = "client-credentials-jwt"	# headless, authenticated by a signed JWT

pkce = "s256"				# PKCE with the SHA-256 challenge
#pkce = "plain"				# PKCE with the plain challenge

#tls.provider = "rustls"		# rustls; omitted, the first TLS the build carries
#tls.provider = "native-tls"		# the platform's TLS
#tls.rustls.crypto = "ring"		# rustls on ring; omitted, the first the build carries
#tls.rustls.crypto = "aws"		# rustls on aws-lc-rs
#tls.cert = "/path/to/cert.pem"		# a PEM certificate to trust beside the platform's
#tls.client = { cert = "/path/to/client.pem", key = "/path/to/client.key.pem" }	# a PEM client certificate and its key, for mutual TLS

storage.read.command = "exit 127"	# prints the stored token JSON
storage.write.command = "exit 127"	# receives the token JSON on stdin

# Google, Microsoft and Fastmail: paste the ready-made account of the
# README instead, https://github.com/pimalaya/ortie#configuration

# Custom
#
#client-id = "example"
#client-secret.command = "exit 127"
#client-key = "/path/to/key.pem"
#client-cert = "/path/to/cert.pem"
#endpoints.authorization = "https://example.com/authorize"
#endpoints.device-authorization = "https://example.com/device"
#endpoints.token = "https://example.com/token"
#endpoints.revocation = "https://example.com/revoke"
#endpoints.redirection = "http://127.0.0.1"
#scopes = ["example"]
