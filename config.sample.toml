[accounts.example]
default = true						# make this account the default one used

grant = "authorization-code"				# sign in through a browser redirection
#grant = "device"					# sign in elsewhere with a user code
#grant = "client-credentials"				# headless, authenticated by the secret
#grant = "client-credentials-jwt"			# headless, authenticated by a signed JWT

client-id = "example"					# the identifier the provider registered
#client-secret.raw = "example"				# the client secret, in clear
#client-secret.command = "exit 127"			# the first line a shell command prints
#client-secret.command = ["sh", "-c", "exit 127"]	# same, an argv run without a shell
#client-key = "/path/to/key.pem"			# private key signing the JWT
#client-cert = "/path/to/cert.pem"			# certificate named in the JWT, for Microsoft

auto-refresh = true					# let token show refresh an expired token
#scopes = []						# no scope, the provider's default
#resources = []						# no RFC 8707 resource indicator
#extras.login_hint = "user@example.com"			# an extra authorization request parameter
#alpn = ["http/1.1"]					# for a middlebox refusing a handshake without ALPN

pkce = "s256"						# PKCE with the SHA-256 challenge
#pkce = "plain"						# PKCE with the plain challenge

tls = "auto"						# the TLS the binary was built with
#tls = "native-tls"					# the platform's TLS
#tls = "rustls-aws"					# rustls on aws-lc-rs
#tls = "rustls-ring"					# rustls on ring

#endpoints.authorization = "https://example.com/authorize"	# where the browser signs in
#endpoints.device-authorization = "https://example.com/device"	# where the device grant gets its code
#endpoints.token = "https://example.com/token"			# where grants and refreshes get tokens
#endpoints.revocation = "https://example.com/revoke"		# where token revoke revokes
endpoints.redirection = "http://127.0.0.1"			# loopback on a random port
#endpoints.redirection = "http://localhost:8080"		# loopback on a fixed port
#endpoints.redirection = "org.example.app://redirect"		# caught by hand through auth resume

storage.read.command = "exit 127"			# prints the stored token JSON
storage.write.command = "exit 127"			# receives the token JSON on stdin
