[accounts.example]
default = true				# make this account the default one used
auto-refresh = true			# let token show refresh an expired token
#auto-refresh = false			# let token show print it expired
#resources = []				# RFC 8707 resource indicators
#extras.login_hint = "user@example.com"	# an extra authorization request parameter
#alpn = ["http/1.1"]			# for a middlebox refusing a handshake without ALPN

grant = "authorization-code"		# sign in through a browser redirection
#grant = "device"			# sign in elsewhere with a user code
#grant = "client-credentials"		# headless, authenticated by the secret
#grant = "client-credentials-jwt"	# headless, authenticated by a signed JWT

pkce = "s256"				# PKCE with the SHA-256 challenge
#pkce = "plain"				# PKCE with the plain challenge

tls = "auto"				# the TLS the binary was built with
#tls = "native-tls"			# the platform's TLS
#tls = "rustls-aws"			# rustls on aws-lc-rs
#tls = "rustls-ring"			# rustls on ring

storage.read.command = "exit 127"	# prints the stored token JSON
storage.write.command = "exit 127"	# receives the token JSON on stdin

