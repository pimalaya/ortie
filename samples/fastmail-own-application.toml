# Fastmail over JMAP (mail, contacts, calendars) with an application you
# register yourself.
#
# Fastmail registers a client on request (RFC 7591), and the same request always
# answers the same client id. It accepts only a reverse-DNS private-use
# redirection. Register once, then set `client-id` to the `client_id` answered:
#
#   curl -s https://api.fastmail.com/oauth/register \
#     -H 'Content-Type: application/json' -d @- <<'EOF'
#   {
#     "client_name": "Ortie",
#     "redirect_uris": ["org.pimalaya.ortie://redirect"],
#     "token_endpoint_auth_method": "none",
#     "grant_types": ["authorization_code", "refresh_token"],
#     "response_types": ["code"],
#     "scope": "urn:ietf:params:oauth:scope:mail urn:ietf:params:oauth:scope:contacts urn:ietf:params:oauth:scope:calendars offline_access"
#   }
#   EOF
#
# No desktop browser routes that redirection back: `ortie auth get` prints an
# `ortie auth resume` command, to run with the address the browser stopped on.
#
# Append it to your configuration, then run `ortie auth get -a fastmail`.
# Storage and every other field: config.sample.toml.

[accounts.fastmail]
client-id = ""
endpoints.authorization = "https://api.fastmail.com/oauth/authorize"
endpoints.token = "https://api.fastmail.com/oauth/refresh"
endpoints.revocation = "https://api.fastmail.com/oauth/revoke"
endpoints.redirection = "org.pimalaya.ortie://redirect"
scopes = [
  "urn:ietf:params:oauth:scope:mail",
  "urn:ietf:params:oauth:scope:contacts",
  "urn:ietf:params:oauth:scope:calendars",
  "offline_access",
]
# Without the JMAP session as resource indicator (RFC 8707), the authorization
# request bounces with `invalid_target` before any consent screen.
resources = ["https://api.fastmail.com/jmap/session"]
# Fastmail checks every authorization parameter strictly: add no `extras`
# beyond `login_hint`.
auto-refresh = true
storage.read.command = ["pass", "show", "ortie/fastmail"]
storage.write.command = "pass insert -m -f ortie/fastmail"
