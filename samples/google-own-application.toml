# Google with an application of your own: CalDAV, CardDAV, or any scope
# Pimalaya's application is not registered for.
#
# In a Google Cloud project, enable the APIs your scopes reach (CalDAV, CardDAV,
# Gmail), configure the consent screen, create a Desktop client, then fill in
# its id and secret. While an external application stays in testing, only its
# test users can sign in, and their refresh tokens expire after 7 days.
#
# Append it to your configuration, then run `ortie auth get -a google`.
# Storage and every other field: config.sample.toml.

[accounts.google]
client-id = ""
client-secret.raw = ""
endpoints.authorization = "https://accounts.google.com/o/oauth2/v2/auth"
endpoints.token = "https://oauth2.googleapis.com/token"
endpoints.revocation = "https://oauth2.googleapis.com/revoke"
# CalDAV takes the whole calendar scope; CardDAV and the People API take two
# different scopes, `carddav` and `contacts`.
scopes = [
  "https://mail.google.com/",
  "https://www.googleapis.com/auth/calendar",
  "https://www.googleapis.com/auth/carddav",
]
# Google issues a refresh token only to a request for offline access.
extras.access_type = "offline"
auto-refresh = true
storage.read.command = ["pass", "show", "ortie/google"]
storage.write.command = "pass insert -m -f ortie/google"
