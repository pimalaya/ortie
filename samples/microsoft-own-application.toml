# Microsoft with an application of your own: an organisation refusing
# Pimalaya's, or any scope it is not registered for.
#
# In Microsoft Entra, register an application, add the "Mobile and desktop
# applications" platform with the redirect URI http://localhost, and allow
# public client flows if you want the device grant. For an application of one
# organisation only, replace `common` with its tenant id.
#
# Append it to your configuration, then run `ortie auth get -a microsoft`.
# Storage and every other field: config.sample.toml.

[accounts.microsoft]
client-id = ""
endpoints.authorization = "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
endpoints.token = "https://login.microsoftonline.com/common/oauth2/v2.0/token"
endpoints.redirection = "http://localhost"
# Entra issues a token for one resource: Outlook scopes and Graph scopes go in
# two accounts.
scopes = [
  "offline_access",
  "https://outlook.office.com/IMAP.AccessAsUser.All",
  "https://outlook.office.com/SMTP.Send",
]
auto-refresh = true
storage.read.command = ["pass", "show", "ortie/microsoft"]
storage.write.command = "pass insert -m -f ortie/microsoft"
