[package]
name = "ortie"
description = "CLI to manage OAuth 2.0 tokens"
version = "2.3.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["oauth", "oauth2", "token", "pkce", "cli"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/ortie"

[features]
default = ["rustls-ring"]
native-tls = ["pimalaya-stream/native-tls", "io-oauth/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-oauth/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-oauth/rustls-ring"]
vendored = ["pimalaya-stream/vendored", "io-oauth/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.3", default-features = false, features = ["build"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"] }
clap = { version = "4.4", default-features = false, features = ["derive", "env", "error-context", "help", "std", "suggestions", "usage"] }
humantime = { version = "2.2", default-features = false }
idna_adapter = { version = "=1.0.0", default-features = false }
io-oauth = { version = "0.5", default-features = false, features = ["client", "jwt-bearer"] }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.3", default-features = false, features = ["terminal"] }
pimalaya-config = { version = "0.3", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
secrecy = { version = "0.10", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
shlex = { version = "2", default-features = false }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false, features = ["serde"] }

[patch.crates-io]
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "65d6d3054978fc7fa6895069c0af2fbcaa160c3c" }
